name: build

# Every push to main checks that Linux and Windows build. A tag like v0.3.0 also publishes a release,
# then installs it on fresh Linux and Windows machines with the one-line installers.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low, so the binary runs on older distros too
          - os: ubuntu-22.04
            asset: cove-linux-x86_64.tar.gz
          - os: windows-latest
            asset: cove-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # the tests use Unix paths
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --release

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/cove
          cp target/release/cove dist/install.sh dist/cove.desktop ../LICENSE pkg/cove/
          cp ../assets/cove.svg pkg/cove/
          tar -C pkg -czf ${{ matrix.asset }} cove

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/cove | Out-Null
          Copy-Item target/release/cove.exe, ../LICENSE pkg/cove/
          Compress-Archive -Path pkg/cove -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: app/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # installed copies compare their own version with the newest tag, so the two must agree
      - name: Tag matches Cargo.toml version
        run: test "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installers
        run: |
          cp install.sh install.ps1 dist/
          cd dist && sha256sum cove-linux-x86_64.tar.gz cove-windows-x86_64.zip > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cove-linux-x86_64.tar.gz
            dist/cove-windows-x86_64.zip
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
          generate_release_notes: true

  # install the published release the way users do, on clean machines
  install-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      COVE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Linux one-liner
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$COVE_VERSION/install.sh" | sh
          test -x ~/.local/bin/cove
          test -f ~/.local/share/applications/cove.desktop
          ~/.local/bin/cove --list
          # a second run is an update and must also work
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$COVE_VERSION/install.sh" | sh

      - name: Windows one-liner (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://github.com/${{ github.repository }}/releases/download/$env:COVE_VERSION/install.ps1" | iex
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Cove'
          if (-not (Test-Path "$dir\cove.exe")) { throw 'cove.exe missing' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Cove.lnk'))) { throw 'Start menu shortcut missing' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw 'not on PATH' }
          # a second run is an update and must also work
          irm "https://github.com/${{ github.repository }}/releases/download/$env:COVE_VERSION/install.ps1" | iex
          if (-not (Test-Path "$dir\cove.exe")) { throw 'cove.exe missing after update' }
